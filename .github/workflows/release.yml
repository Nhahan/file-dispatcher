name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the release without publishing to npm.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never cancel a running release: an interrupted publish leaves a half-finished release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: release-branch-guard
    runs-on: ubuntu-latest
    steps:
      - name: Allow main, or ci-verify/* for dry runs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ] && [[ "$GITHUB_REF" == refs/heads/ci-verify/* ]]; then
            exit 0
          fi
          echo "Releases run from main; dry runs may also run from ci-verify/*. Current ref: $GITHUB_REF"
          exit 1

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # npm >= 11.5.1 is required for trusted publishing (OIDC).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Resolve release
        id: release
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            kind="dry-run"; tag="dry-run"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            kind="beta"; tag="beta"
          else
            kind="stable"; tag="latest"
          fi
          version="$(node scripts/release.js version "$kind")"
          if [ "$kind" = "stable" ] && [[ "$version" == *-* ]]; then
            tag="next"
          fi
          if [ "$kind" = "stable" ]; then
            # Fail before publishing when CHANGELOG.md has no entry for this version.
            node scripts/release.js notes "$version" > "$RUNNER_TEMP/release-notes.md"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version with dist-tag $tag ($kind)."

      - name: Publish to npm
        env:
          KIND: ${{ steps.release.outputs.kind }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if [ "$KIND" = "dry-run" ]; then
            npm publish --access public --tag "$TAG" --dry-run
          else
            npm publish --access public --tag "$TAG" --provenance
          fi

      - name: Create GitHub release
        if: ${{ steps.release.outputs.kind == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
