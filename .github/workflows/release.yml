name: Release

# Pushing a v<version> tag publishes that version. Running the workflow manually is a dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled: an interrupted publish leaves a half-finished release, and
# parallel releases could race for the latest dist-tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      # Only a pushed tag publishes; running the workflow manually, even on a tag, is a dry run.
      RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm with trusted publishing support
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`Trusted publishing needs npm >= 11.5.1, found ${process.argv[1]}.`);
              process.exit(1);
            }' "$(npm --version)"

      - run: npm ci

      - name: Plan release
        id: plan
        run: |
          if [ "$RELEASE" = "true" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME does not point to a commit on main."
              exit 1
            fi
            plan="$(node scripts/release.js plan stable "$GITHUB_REF_NAME")"
          else
            plan="$(node scripts/release.js plan dry-run)"
          fi
          version="$(node -p 'JSON.parse(process.argv[1]).version' "$plan")"
          tag="$(node -p 'JSON.parse(process.argv[1]).tag' "$plan")"
          publish="$(node -p 'JSON.parse(process.argv[1]).publish' "$plan")"
          if [ "$RELEASE" = "true" ]; then
            node scripts/release.js notes "$version" > "$RUNNER_TEMP/release-notes.md"
            if [ "$publish" = "false" ]; then
              echo "::notice::$version is already on npm; only the GitHub release is created if missing."
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: $version with dist-tag $tag, publish=$publish."

      - name: Publish to npm
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            npm publish --access public --tag "$TAG" --provenance
          else
            npm version "$VERSION" --no-git-tag-version
            npm publish --access public --tag "$TAG" --dry-run
          fi

      - name: Create GitHub release
        if: ${{ env.RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
