name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# When Release calls this workflow, github.workflow is "Release"; the ci- prefix keeps this group
# distinct from the caller's, which would otherwise wait on itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}-node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install the packed tarball and import it
        run: |
          npm pack --silent > tarball.txt
          tarball="$PWD/$(cat tarball.txt)"
          tar -tzf "$tarball" | sort
          mkdir consumer
          cd consumer
          npm init -y > /dev/null
          npm install "$tarball"
          node -e "const { dispatch } = require('file-dispatcher'); if (typeof dispatch !== 'function') process.exit(1)"
          node --input-type=module -e "import { dispatch } from 'file-dispatcher'; if (typeof dispatch !== 'function') process.exit(1)"

      - name: Type-check a CommonJS consumer without esModuleInterop
        working-directory: consumer
        run: |
          npm install --no-save typescript@5 @types/node@20
          printf '%s\n' \
            "import { dispatch, type DispatchedFile } from 'file-dispatcher';" \
            "const dispatcher = dispatch('.', (file: DispatchedFile) => console.log(file.id, file.size), { filter: /x/, done: { moveTo: 'y' } });" \
            "dispatcher.on('error', (error, file) => console.log(error.message, file?.name));" \
            "void dispatcher.close();" > consumer.ts
          npx tsc --noEmit --strict --module commonjs --moduleResolution node10 --ignoreDeprecations 5.0 consumer.ts
